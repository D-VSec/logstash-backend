[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    storage.path /var/log/fluent-bit-storage
    storage.sync normal
    storage.checksum on
    storage.backlog.mem_limit 50M
    storage.max_chunks_up 128

[INPUT]
    Name              tail
    Path              /var/log/syslog,/var/log/auth.log,/var/log/kern.log,/var/log/cloud-init.log,/var/log/cloud-init-output.log
    Tag               vm.logs
    DB                /var/lib/fluent-bit/tail.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    Off
    storage.type      filesystem

[OUTPUT]
    Name                file
    Match               vm.logs
    Path                /var/log/fluent-bit-archive
    File                vm-logs.jsonl
    Mkdir               On
    Retry_Limit         False
    storage.total_limit_size 5G